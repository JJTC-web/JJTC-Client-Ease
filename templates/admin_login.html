{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="card">
  <h1>Admin Login</h1>
  <p class="subtitle">Enter the admin password to view client reviews and submissions.</p>
  {% if error %}
  <p style="color:#D64545; font-weight:600;">{{ error }}</p>
  {% endif %}
  <form method="POST">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus>
    <button type="submit">Log In</button>
  </form>
</div>
{% endblock %}
